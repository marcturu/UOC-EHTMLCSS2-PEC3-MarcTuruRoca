<section class="relative overflow-hidden" aria-labelledby="hero-title">
  <picture>
    <!-- Mobile (3:4 -> 0.75) -->
    <source
      media="(max-width: 768px)"
      srcset="
        ./assets/images/home/hero-mobile.jpg?width=900&as=webp 900w,
        ./assets/images/home/hero-mobile.jpg?width=1200&as=webp 1200w
      "
      sizes="100vw"
    />
    <!-- Desktop (3:2 -> 1.5) -->
    <img
      class="h-vh w-full object-cover"
      src="./assets/images/home/hero.jpg?width=1600&as=webp"
      srcset="
        ./assets/images/home/hero.jpg?width=1200&as=webp 1200w,
        ./assets/images/home/hero.jpg?width=1600&as=webp 1600w,
        ./assets/images/home/hero.jpg?width=1920&as=webp 1920w
      "
      alt=""
      width="1920"
      height="1080"
      decoding="async"
      fetchpriority="high"
    />
  </picture>

  <a href=""
    class="hero-btn hero-btn--primary absolute left-[50%] top-[37%] -translate-x-1/2 -translate-y-1/2
          md:left-[27.5%] md:top-[87%]"
  >
    MÁS INFORMACIÓN
    <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
  </a>
</section>
